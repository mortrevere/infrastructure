---
- name: Manage nginx host configuration
  hosts: "{{ target_hosts | default('dev') }}"
  become: true
  gather_facts: true

  tasks:
    - name: Manage packages and services
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/packages-services.yml"

    - name: Manage nftables firewall
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/firewall.yml"

    - name: Flush nftables reload before continuing
      ansible.builtin.meta: flush_handlers

    - name: Prepare nginx for ACME bootstrap
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/nginx.yml"

    - name: Manage Let's Encrypt certificates
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/letsencrypt-certificates.yml"

  handlers:
    - name: Validate nginx
      ansible.builtin.command: nginx -t
      changed_when: false
      listen: Reload nginx

    - name: Reload nginx service
      ansible.builtin.service:
        name: nginx
        state: reloaded
      listen: Reload nginx

    - name: Restart nftables service
      ansible.builtin.service:
        name: nftables
        state: restarted
      listen: Restart nftables
