---
- name: Manage nginx host configuration
  hosts: "{{ target_hosts | default('prod') }}"
  become: true
  gather_facts: true

  tasks:
    - name: Harden SSH, nginx, and service logging
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/security.yml"
        apply:
          tags: [security, hardening]
      tags: [security, hardening]

    - name: Install Docker from Docker's apt repository
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/docker.yml"
        apply:
          tags: [docker]
      tags: [docker]

    - name: Manage nftables firewall
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/firewall.yml"
        apply:
          tags: [firewall, hardening]
      tags: [firewall, hardening]

    - name: Manage packages and services
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/packages-services.yml"

    - name: Manage WireGuard
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/wireguard.yml"
      when: wireguard_enabled | bool
      
    - name: Flush nftables reload before continuing
      ansible.builtin.meta: flush_handlers
      tags: [always]

    - name: Prepare nginx for ACME bootstrap
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/nginx.yml"

    - name: Manage Let's Encrypt certificates
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/letsencrypt-certificates.yml"

    - name: Install Umami
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/umami.yml"
        apply:
          tags: [umami]
      tags: [umami]

  handlers:
    - name: Validate nginx
      ansible.builtin.command: nginx -t
      changed_when: false
      listen: Reload nginx

    - name: Reload nginx service
      ansible.builtin.service:
        name: nginx
        state: reloaded
      listen: Reload nginx

    - name: Reload nftables service
      ansible.builtin.service:
        name: nftables
        state: reloaded
      listen: Reload nftables

    - name: Validate SSH configuration
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
      listen: Reload SSH

    - name: Reload SSH service
      ansible.builtin.service:
        name: ssh
        state: reloaded
      listen: Reload SSH

    - name: Restart docker service
      ansible.builtin.service:
        name: docker
        state: restarted
      when: not ansible_check_mode
      listen: Restart docker

    - name: Reload sysctl settings
      ansible.builtin.command: sysctl --system
      changed_when: false
      listen: Reload sysctl

- name: Manage node_exporter
  hosts: "{{ node_exporter_hosts | default('prod:house') }}"
  become: true
  gather_facts: true
  tags: [node-exporter]

  tasks:
    - name: Install node_exporter
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/node-exporter.yml"
