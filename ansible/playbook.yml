---
- name: Manage infrastructure hosts
  hosts: "{{ target_hosts | default('prod') }}"
  become: true
  gather_facts: true

  pre_tasks:
    - name: Require Debian-family host
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: This stack targets Debian-family hosts.
      tags: [always]

  tasks:
    - name: Harden SSH, nginx, and service logging
      ansible.builtin.import_tasks: tasks/security.yml
      tags: [security, hardening]

    - name: Manage Docker
      ansible.builtin.import_tasks: tasks/docker.yml
      tags: [docker]

    - name: Manage nftables firewall
      ansible.builtin.import_tasks: tasks/firewall.yml
      tags: [firewall, hardening]

    - name: Manage WireGuard
      ansible.builtin.import_tasks: tasks/wireguard.yml
      when: wireguard_enabled | bool
      tags: [wireguard]

    - name: Apply host configuration before deploying services
      ansible.builtin.meta: flush_handlers
      tags: [always]

    - name: Deploy web content
      ansible.builtin.import_tasks: tasks/packages-services.yml
      tags: [web]

    - name: Manage nginx and certificates
      ansible.builtin.import_tasks: tasks/nginx.yml
      tags: [web]

    - name: Manage Umami
      ansible.builtin.import_tasks: tasks/umami.yml
      tags: [umami]

    - name: Manage node_exporter
      ansible.builtin.import_tasks: tasks/node-exporter.yml
      tags: [node-exporter]

  handlers:
    - name: Validate nginx
      ansible.builtin.command: nginx -t
      changed_when: false
      listen: Reload nginx

    - name: Reload nginx service
      ansible.builtin.service:
        name: nginx
        state: reloaded
      listen: Reload nginx

    - name: Reload nftables service
      ansible.builtin.service:
        name: nftables
        state: reloaded
      listen: Reload nftables

    - name: Validate SSH configuration
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
      listen: Reload SSH

    - name: Reload SSH service
      ansible.builtin.service:
        name: ssh
        state: reloaded
      listen: Reload SSH

    - name: Reload sysctl settings
      ansible.builtin.command: sysctl --system
      changed_when: false
      listen: Reload sysctl

    - name: Restart docker service
      ansible.builtin.service:
        name: docker
        state: restarted
      when: not ansible_check_mode
      listen: Restart docker
