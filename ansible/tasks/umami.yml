---
- name: Clone Umami on target host
  ansible.builtin.git:
    repo: "{{ umami_repo_url }}"
    dest: "{{ umami_checkout_dir }}"
    version: "{{ umami_repo_version }}"
    update: true
  register: umami_checkout
  when: not ansible_check_mode

- name: Run Umami docker compose stack
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ umami_checkout_dir }}"
  register: umami_compose
  changed_when: >-
    umami_checkout.changed
    or (umami_compose.stdout is search('(?i)creating|recreating|starting|pulling|building|removing|restarted'))
  when: not ansible_check_mode
