---
- name: Remove obsolete nginx configurations
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/default
    - "{{ nginx_conf_dir }}/default.conf"
    - "{{ nginx_conf_dir }}/00-acme-bootstrap.conf"
  notify: Reload nginx

- name: Install shared TLS settings
  ansible.builtin.template:
    src: tls.conf.j2
    dest: /etc/nginx/snippets/infrastructure-tls.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Inspect existing certificates
  ansible.builtin.stat:
    path: "{{ letsencrypt_live_dir }}/{{ item.name }}/fullchain.pem"
    follow: true
    checksum_algorithm: sha256
  loop: "{{ nginx_sites }}"
  register: certbot_before

- name: Configure HTTP challenges and preserve existing HTTPS sites
  ansible.builtin.template:
    src: site.conf.j2
    dest: "{{ nginx_conf_dir }}/{{ site.name }}.conf"
    owner: root
    group: root
    mode: "0644"
  vars:
    site: "{{ item.item }}"
    tls_enabled: "{{ item.stat.exists }}"
  loop: "{{ certbot_before.results }}"
  notify: Reload nginx

- name: Ensure nginx is enabled and running
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Serve HTTP challenges before certificate reconciliation
  ansible.builtin.meta: flush_handlers

- name: Obtain or expand each site's certificate
  ansible.builtin.command:
    cmd: >-
      certbot certonly
      --webroot
      --webroot-path {{ certbot_webroot }}
      --cert-name {{ item.name }}
      -d {{ item.name }}
      {{ '-d www.' ~ item.name if item.www | default(true) else '' }}
      --non-interactive
      --agree-tos
      --expand
      --keep-until-expiring
      --no-directory-hooks
      {{ '--staging' if certbot_use_staging else '' }}
      {{ '--email ' ~ certbot_email if certbot_email | length > 0 else '--register-unsafely-without-email' }}
  loop: "{{ nginx_sites }}"
  changed_when: false
  when: not ansible_check_mode

- name: Detect certificate changes for nginx reload
  ansible.builtin.stat:
    path: "{{ letsencrypt_live_dir }}/{{ item.name }}/fullchain.pem"
    follow: true
    checksum_algorithm: sha256
  loop: "{{ nginx_sites }}"
  loop_control:
    index_var: cert_index
  register: certbot_after
  changed_when: >-
    certbot_after.stat.checksum | default('') !=
    certbot_before.results[cert_index].stat.checksum | default('')
  notify: Reload nginx
  when: not ansible_check_mode

- name: Enable HTTPS for newly issued certificates
  ansible.builtin.template:
    src: site.conf.j2
    dest: "{{ nginx_conf_dir }}/{{ site.name }}.conf"
    owner: root
    group: root
    mode: "0644"
  vars:
    site: "{{ item.item }}"
    tls_enabled: true
  loop: "{{ certbot_before.results }}"
  when:
    - not ansible_check_mode
    - not item.stat.exists
  notify: Reload nginx

- name: Install nginx reload hook for renewed certificates
  ansible.builtin.copy:
    dest: "{{ letsencrypt_dir }}/renewal-hooks/deploy/reload-nginx.sh"
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      set -eu
      nginx -t
      systemctl reload nginx

- name: Enable Certbot automatic renewal timer
  ansible.builtin.systemd:
    name: certbot.timer
    enabled: true
    state: started

- name: Activate configured HTTPS sites before deploying other services
  ansible.builtin.meta: flush_handlers
