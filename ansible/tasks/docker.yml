---
- name: Install Docker apt repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure Docker apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check Docker apt repository signing key
  ansible.builtin.stat:
    path: /etc/apt/keyrings/docker.asc
  register: docker_apt_signing_key

- name: Download Docker apt repository signing key
  ansible.builtin.command:
    argv:
      - curl
      - --fail
      - --silent
      - --show-error
      - --location
      - --output
      - /etc/apt/keyrings/docker.asc
      - https://download.docker.com/linux/debian/gpg
  changed_when: true
  when: not docker_apt_signing_key.stat.exists

- name: Set Docker apt repository signing key permissions
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.asc
    state: file
    owner: root
    group: root
    mode: "0644"

- name: Detect Debian package architecture
  ansible.builtin.command: dpkg --print-architecture
  register: docker_debian_architecture
  changed_when: false
  check_mode: false

- name: Configure Docker apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: {{ ansible_distribution_release }}
      Components: stable
      Architectures: {{ docker_debian_architecture.stdout }}
      Signed-By: /etc/apt/keyrings/docker.asc

- name: Install latest Docker Engine from Docker's apt repository
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: latest
    update_cache: true
  notify: Restart docker
  when: not ansible_check_mode

- name: Ensure Docker service is enabled and running
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Check installed Docker server version
  ansible.builtin.command:
    cmd: docker version --format '{{ "{{" }}.Server.Version{{ "}}" }}'
  register: docker_server_version
  changed_when: false
  when: not ansible_check_mode

- name: Require Docker Engine 29 or newer for nftables firewall backend
  ansible.builtin.assert:
    that:
      - docker_server_version.stdout is version('29.0.0', '>=')
    fail_msg: >-
      Docker Engine {{ docker_server_version.stdout }} is installed, but Docker Engine
      29.0.0 or newer is required for the nftables firewall backend.
  when: not ansible_check_mode
