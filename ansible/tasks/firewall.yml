---
- name: Install nftables firewall policy
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: "{{ firewall_nftables_conf }}"
    owner: root
    group: root
    mode: "0644"
    validate: "nft -c -f %s"
  notify:
    - Reload nftables

- name: Ensure nftables service override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Keep nftables stop from deleting Docker's firewall tables
  ansible.builtin.copy:
    dest: /etc/systemd/system/nftables.service.d/infrastructure.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      ExecStop=
      ExecStop=/usr/sbin/nft destroy table inet filter
  register: nftables_service_override

- name: Reload systemd after changing nftables service
  ansible.builtin.systemd:
    daemon_reload: true
  when: nftables_service_override.changed

- name: Ensure Docker daemon configuration directory exists
  ansible.builtin.file:
    path: "{{ docker_daemon_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Docker to use the nftables firewall backend
  ansible.builtin.copy:
    dest: "{{ docker_daemon_config_file }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "firewall-backend": "nftables",
        "ip-forward": true
      }
  notify: Restart docker

- name: Ensure nftables service is enabled and running
  ansible.builtin.service:
    name: nftables
    enabled: true
    state: started

- name: Enable IP forwarding for Docker bridge networks
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-docker-forwarding.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
  notify: Reload sysctl
