---
home_web_symlink_owner: debian

firewall_allowed_udp_ports:
  - "{{ wireguard_listen_port }}"
firewall_extra_input_rules:
  - iifname "wg0" tcp dport 9100 ip saddr 100.64.88.0/24 accept
firewall_extra_forward_rules:
  - iifname "wg0" oifname "wg0" ip saddr 100.64.88.0/24 ip daddr 100.64.88.0/24 accept

wireguard_enabled: true

nginx_sites:
  - name: leo.surf
    jinjapocalypse_git_source: https://github.com/mortrevere/leo.surf.git

  - name: stats.leo.surf
    www: false
    upstream: http://127.0.0.1:3000/

  - name: estcequilfaitchaud.fr
    www_source: estcequilfaitchaud.fr/index.html

  - name: below.industries
    jinjapocalypse_git_source: https://github.com/beLow-Industries/below.industries.git

  - name: leshauts.xyz
    www_source: leshauts.xyz/
    www_deploy_strategy: rsync_checksum
    locations:
      - path: /romejko/
        alias: "{{ nginx_html_root }}/leshauts.xyz/romejko/build/"
    error_pages: true

  - name: below.black
    jinjapocalypse_git_source: https://github.com/mortrevere/below.black.git
    no_cache: true
